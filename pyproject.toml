[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "rts96-reliability-uc"
version = "0.1.0"
description = "Reliability-constrained stochastic UC with adaptive MDP dispatch on IEEE RTS-96"
authors = [{ name = "Gema Wachid Aryasatya", email = "gematax15@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "highspy>=1.7,<2",
    "numpy>=1.24,<2",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "pandapower>=2.13",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
run-rts96 = "rts96_reliability_uc.runner:main"
